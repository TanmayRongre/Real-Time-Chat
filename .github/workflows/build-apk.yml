name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build LiveChat APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Create Client Production Environment
        run: |
          echo "VITE_API_URL=https://real-time-chat-hrji.onrender.com/api" >> client/.env
          echo "VITE_SOCKET_URL=https://real-time-chat-hrji.onrender.com" >> client/.env

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build --workspace=client
          cd client
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x client/android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd client/android
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveChat-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
